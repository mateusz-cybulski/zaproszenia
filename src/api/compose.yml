# Included by .config/docker-compose.yml: paths are relative to this file.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    platform: linux/amd64
    # Migrations and reference data run before the server, in its container: locally there is
    # one instance. Production runs them in the deploy workflow, never in the API process.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head
        && python -m app.system_templates
        && python -m app.seed
        && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://api:api@api-db:5432/api
      DEV_AUTH_USER: dev@localhost
      LOCAL_STORAGE_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - api-storage:/data/storage
    depends_on:
      api-db:
        condition: service_healthy
    develop:
      watch:
        # A new migration restarts the container, which runs the migrations again.
        - action: sync+restart
          path: migrations/
          target: /app/migrations
        - action: sync
          path: .
          target: /app
          ignore:
            - migrations/
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  api-db:
    image: postgres:18-alpine
    platform: linux/amd64
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api
    ports:
      - "5432:5432"
    volumes:
      - api-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  api-db-data:
  api-storage:
