# Included by .config/docker-compose.yml: paths are relative to this file.
x-api: &api
  build:
    context: .
    dockerfile: Dockerfile.dev
  platform: linux/amd64
  environment:
    DATABASE_URL: postgresql+psycopg://api:api@api-db:5432/api
    DEV_AUTH_USER: dev@localhost

services:
  api:
    <<: *api
    environment:
      DATABASE_URL: postgresql+psycopg://api:api@api-db:5432/api
      DEV_AUTH_USER: dev@localhost
      LOCAL_STORAGE_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - api-storage:/data/storage
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  # Never migrate inside the API process: instances would race each other.
  api-migrate:
    <<: *api
    command: ["sh", "-c", "alembic upgrade head && python -m app.system_templates && python -m app.seed"]
    depends_on:
      api-db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: migrations/

  api-db:
    image: postgres:18-alpine
    platform: linux/amd64
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api
    ports:
      - "5432:5432"
    volumes:
      - api-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  api-db-data:
  api-storage:
