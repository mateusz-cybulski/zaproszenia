# Local dev service, included by .config/docker-compose.yml. Paths are relative to this file.
x-api: &api
  build:
    context: .
    dockerfile: Dockerfile.dev
  platform: linux/amd64
  environment:
    DATABASE_URL: postgresql+psycopg://api:api@api-db:5432/api
    # No Identity Platform locally: every request is signed in as this user.
    DEV_AUTH_USER: dev@localhost

services:
  api:
    <<: *api
    ports:
      - "8000:8000"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    # `docker compose up --watch` (mise run dev): source changes are copied into the
    # container, where uvicorn --reload picks them up. The virtualenv comes from the image, so
    # a dependency change rebuilds it. Files in .dockerignore (tests, caches) are never synced.
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  # Applies migrations once before the API starts, like the Cloud Run job planned for
  # production. Never inside the API process: instances would race each other.
  # Then adds sample guests for the local user (app/seed.py; skipped once there are guests).
  api-migrate:
    <<: *api
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      api-db:
        condition: service_healthy
    # A new or changed migration runs again right away: the rebuilt image carries it.
    develop:
      watch:
        - action: rebuild
          path: migrations/

  api-db:
    image: postgres:18-alpine
    platform: linux/amd64
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api
    ports:
      - "5432:5432"
    volumes:
      - api-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  api-db-data:
