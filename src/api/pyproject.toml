[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "firebase-admin>=7.8.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "morfeusz2>=1.99.15",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.1.0",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "C4", "PTH", "RUF", "ASYNC", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
# Deprecated APIs fail the check instead of only showing in the editor.
enable_error_code = ["deprecated"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# morfeusz2 is a SWIG binding whose types trip a Python 3.14 deprecation warning on import.
filterwarnings = [
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

[[tool.mypy.overrides]]
module = [
    "firebase_admin",
    "firebase_admin.*",
    "google.cloud.storage",
    "google.cloud.storage.*",
    "morfeusz2",
    "pypdfium2",
    "pypdfium2.*",
    "reportlab",
    "reportlab.*",
]
ignore_missing_imports = true
